  <!-- Safari WebGL2 Fix -->
  <script>
    if (
      navigator.userAgent.indexOf("Safari") !== -1 &&
      navigator.userAgent.indexOf("Chrome") === -1
    ) {
      var originalGetContext =
        HTMLCanvasElement.prototype.getContext;

      HTMLCanvasElement.prototype.getContext = function () {
        var contextType = arguments[0];

        if (contextType === "webgl2") {
          return null;
        }

        return originalGetContext.apply(
          this,
          [contextType].concat(
            Array.prototype.slice.call(arguments, 1)
          )
        );
      };
    }
  </script>

<!-- SVG Image Replacement Script -->
<script>
  document.querySelectorAll("img.svg").forEach(function (img) {

    var imgID = img.getAttribute("id");
    var imgClass = img.getAttribute("class");
    var imgURL = img.getAttribute("src");

    var xhr = new XMLHttpRequest();

    xhr.open("GET", imgURL, true);

    xhr.responseType = "document";

    xhr.onload = function () {

      if (xhr.status === 200) {

        var data = xhr.response;

        var svg = data.querySelector("svg");

        if (!svg) {
          return;
        }

        // Add image ID
        if (typeof imgID !== "undefined" && imgID !== null) {
          svg.setAttribute("id", imgID);
        }

        // Add image classes
        if (typeof imgClass !== "undefined" && imgClass !== null) {
          svg.setAttribute(
            "class",
            imgClass + " replaced-svg"
          );
        }

        // Remove invalid XML attribute
        svg.removeAttribute("xmlns:a");

        // Set viewBox if missing
        if (
          !svg.getAttribute("viewBox") &&
          svg.getAttribute("height") &&
          svg.getAttribute("width")
        ) {
          svg.setAttribute(
            "viewBox",
            "0 0 " +
            svg.getAttribute("height") +
            " " +
            svg.getAttribute("width")
          );
        }

        // Replace image with SVG
        if (img.parentNode) {
          img.parentNode.replaceChild(svg, img);
        }

      }

    };

    xhr.onerror = function () {
      console.warn(
        "Unable to load SVG image:",
        imgURL
      );
    };

    xhr.send();

  });
</script>

<!-- Theme Detection -->
<script>
  if (typeof Storage !== "undefined") {

    var itemValue =
      localStorage.getItem("flutter.demand_theme");

    console.log("flutter.theme", itemValue);

    if (itemValue !== null) {

      if (itemValue === "true") {

        document.body.classList.add("theme-dark");

      } else {

        document.body.classList.remove("theme-light");

      }

    } else {

      console.log(
        "Theme item not found in localStorage"
      );

    }

  } else {

    console.log(
      "localStorage is not supported in this browser"
    );

  }
</script>
